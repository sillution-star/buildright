services:
  # Backend API
  - type: web
    name: momtest-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false   # you paste this in Render dashboard
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false

  # Frontend (static site)
  - type: static
    name: momtest-frontend
    rootDir: frontend
    buildCommand: echo "no build needed"
    staticPublishPath: .
    envVars:
      - key: API_BASE
        value: https://momtest-backend.onrender.com
